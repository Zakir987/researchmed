<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AlliedPath student and staff portal: classes, learning content, tests, mock interviews and progress.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230b1a30'/%3E%3Cpath fill='%232ed3bf' d='M15 6h10v9h9v10h-9v9H15v-9H6V15h9z'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AlliedPath ERP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: AlliedPath brand console — a quiet ink sidebar of departments, a scrub-teal accent for action, status encoded as pills and stripes. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --sunk:#e9eef4; --ink:#0b1a30; --muted:#5b6b80; --line:#d7e0e9;
  --side:#0b1a30; --side-ink:#dde6f0; --side-muted:#8fa1b8; --side-hi:#16294a; --brand-teal:#2ed3bf;
  --scrub:#12917f; --scrub-ink:#ffffff; --scrub-soft:#d5f2ed; --wordmark:#14a096;
  --amber:#9a5c07; --amber-soft:#fbeed6; --red:#ad322b; --red-soft:#f8e0dd;
  --green:#2b7336; --green-soft:#def0e1; --blue:#2a5a97; --blue-soft:#dfe9f6;
  --hero-end:#0f5a5a; --hero-ink:#ffffff; --scrub-deep:#0f8277; --id-ink:#06221e;
  --display:'Poppins', 'Segoe UI', system-ui, sans-serif;
  --body:'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1322; --surface:#111d31; --sunk:#17253c; --ink:#e6edf5; --muted:#93a4ba; --line:#24344d;
  --side:#060e1b; --side-ink:#dde6f0; --side-muted:#7f92ab; --side-hi:#132440; --brand-teal:#2ed3bf;
  --scrub:#2ed3bf; --scrub-ink:#04201c; --scrub-soft:#103a3a; --wordmark:#2ed3bf;
  --amber:#e5a64c; --amber-soft:#382a13; --red:#ee7f75; --red-soft:#3c1c1a;
  --green:#7cc489; --green-soft:#19321e; --blue:#89b2ea; --blue-soft:#19283d;
  --hero-end:#0c4447; --hero-ink:#ffffff; --scrub-deep:#14a096; --id-ink:#04201c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a1322; --surface:#111d31; --sunk:#17253c; --ink:#e6edf5; --muted:#93a4ba; --line:#24344d;
  --side:#060e1b; --side-ink:#dde6f0; --side-muted:#7f92ab; --side-hi:#132440; --brand-teal:#2ed3bf;
  --scrub:#2ed3bf; --scrub-ink:#04201c; --scrub-soft:#103a3a; --wordmark:#2ed3bf;
  --amber:#e5a64c; --amber-soft:#382a13; --red:#ee7f75; --red-soft:#3c1c1a;
  --green:#7cc489; --green-soft:#19321e; --blue:#89b2ea; --blue-soft:#19283d;
  --hero-end:#0c4447; --hero-ink:#ffffff; --scrub-deep:#14a096; --id-ink:#04201c; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem;line-height:1.15}
h2{font-size:1.15rem}
h3{font-size:1rem}
.mono{font-family:var(--mono);font-size:.82em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding-block:20px;padding-left:max(14px, env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.brand b em{font-style:normal;color:var(--brand-teal)}
.splash .brand b em{color:var(--wordmark)}
.brand img,.brand .aplogo{width:38px;height:38px;flex:none;border-radius:9px}
.brand span{display:block;font-size:.72rem;color:var(--side-muted);text-transform:uppercase;letter-spacing:.09em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--side-ink);font-size:.93rem}
.nav button:hover{background:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--scrub);color:var(--scrub-ink);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}
.nav .count{font-family:var(--mono);font-size:.72rem;opacity:.85}
.navlabel{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);padding:10px 10px 4px}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--side-hi);font-size:.85rem}
.who img{width:30px;height:30px;border-radius:50%}
.who small{display:block;color:var(--side-muted);font-size:.75rem}

.main{min-width:0;padding-block:26px 60px;padding-left:max(16px, 3vw);padding-right:max(16px, env(safe-area-inset-right,0px), 3vw)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--scrub)}
.btn.primary{background:var(--scrub);color:var(--scrub-ink);border-color:var(--scrub)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--scrub);padding-inline:6px}
.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.link:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--scrub);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .s{font-size:.82rem;color:var(--muted)}
.kpi.warn .v{color:var(--amber)} .kpi.bad .v{color:var(--red)} .kpi.good .v{color:var(--green)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section{margin-top:26px}
.section>h2{margin-bottom:10px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.li .d{font-size:.85rem;color:var(--muted)}
.when{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .mono{opacity:.7;margin-left:4px}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--sunk)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.teal{background:var(--scrub-soft);color:var(--scrub)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.stripe{border-left:4px solid var(--line)}
.stripe.urgent{border-left-color:var(--red)} .stripe.high{border-left-color:var(--amber)} .stripe.medium{border-left-color:var(--blue)} .stripe.low{border-left-color:var(--line)}

.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--scrub);border-radius:4px}
.bar.low i{background:var(--red)}
.funnel{display:grid;grid-template-columns:110px 1fr 38px;gap:8px 10px;align-items:center;font-size:.88rem}
.funnel .bar{height:14px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--scrub)}
.card .meta{font-size:.84rem;color:var(--muted)}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-size:.85rem;display:flex;justify-content:space-between;padding:2px 4px}
.col .card{padding:10px 12px}

.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px}
.facts div span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts div b{font-weight:500;overflow-wrap:anywhere}

.att{display:flex;gap:6px}
.att button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.att button[aria-pressed="true"].p{background:var(--green);color:var(--surface);border-color:var(--green)}
.att button[aria-pressed="true"].a{background:var(--red);color:var(--surface);border-color:var(--red)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font-family:var(--display);font-size:1.05rem}
.note{background:var(--scrub-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.note.warn{background:var(--amber-soft)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(8,16,18,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding-block:max(20px, env(safe-area-inset-top,0px)) 40px;padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:14px;width:min(640px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-top:4vh}
.sheet h2{margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:.8rem;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:.78rem}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--scrub);outline-offset:0;border-color:var(--scrub)}
.full{grid-column:1/-1}
.field input[type=checkbox],.check input{width:auto;flex:none;accent-color:var(--scrub)}
.field .check{font-size:.9rem;color:var(--ink);font-weight:500}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.sheetfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:18px}
.sheetfoot .right{display:flex;gap:8px;margin-left:auto}
.formerr{color:var(--red);font-size:.88rem;margin-top:10px}
.log{margin-top:6px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto}
.log div{font-size:.86rem}
.picks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pick{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);cursor:pointer;text-align:left}
.pick img{width:28px;height:28px;border-radius:50%}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}

.splash{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.splash .panel{max-width:520px}


.btn svg{width:16px;height:16px}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(16px,-18px) rotate(18deg)}}
@keyframes shimmer{0%{left:-60%}55%,100%{left:130%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--scrub)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ringIn{from{stroke-dashoffset:327px}}
@keyframes grow{from{width:0}}
.enter .main>*,.enter .sp-main>*,.enter .hero-in>*,.enter .stabs{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.enter .main>*:nth-child(2),.enter .sp-main>*:nth-child(2),.enter .hero-in>*:nth-child(2){animation-delay:.08s}
.enter .main>*:nth-child(3),.enter .sp-main>*:nth-child(3){animation-delay:.16s}
.enter .main>*:nth-child(n+4),.enter .sp-main>*:nth-child(n+4){animation-delay:.24s}
.enter .stagger>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 60ms + .15s)}
.enter .ring .val{animation:ringIn 1.3s cubic-bezier(.2,.7,.2,1) .25s both}
.enter .steps .bar i{animation:grow 1.2s .3s both}
.sheet.pop{animation:pop .28s cubic-bezier(.2,.7,.2,1) both}

/* student portal */
.pvbar{background:var(--amber-soft);color:var(--ink);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:10px;font-size:.9rem}
.sp-top{background:var(--side);color:var(--side-ink)}
.sp-top-in{max-width:1120px;margin:0 auto;padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sp-top .me{width:34px;height:34px;border-radius:50%}
.hero{position:relative;overflow:hidden;background:linear-gradient(130deg,var(--side) 0%,var(--side-hi) 52%,var(--hero-end) 100%);color:var(--side-ink)}
.blobs{position:absolute;inset:0;pointer-events:none}
.blob{position:absolute;color:var(--brand-teal);opacity:.15;animation:drift 10s ease-in-out infinite}
.blob svg{width:100%;height:100%;display:block}
.hero-in{position:relative;max-width:1120px;margin:0 auto;padding-block:30px 32px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.hero-in>div:first-child{min-width:0;flex:1 1 280px}
.hero .eyebrow{color:var(--brand-teal);font-weight:600;font-size:.95rem;margin:0 0 4px}
.hero h1{color:var(--hero-ink);font-size:clamp(1.8rem,4.6vw,2.6rem);line-height:1.1}
.hero .sub{margin:8px 0 0;color:var(--side-muted)}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s ease-in-out .8s 2}
.idwrap{flex:0 1 340px;min-width:0}
.idcard{position:relative;overflow:hidden;border-radius:18px;padding:16px 18px 18px;background:linear-gradient(140deg,var(--brand-teal),var(--scrub-deep));color:var(--id-ink);box-shadow:0 22px 44px -18px rgba(0,0,0,.55);transition:transform .3s}
.idcard:hover{transform:translateY(-3px) rotate(-.6deg)}
.idcard::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shimmer 4s ease-in-out 1s infinite}
.id-top{display:flex;align-items:center;gap:10px}
.idcard img,.idcard .aplogo{width:30px;height:30px;border-radius:8px}
.idcard .lbl{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.75}
.idcard .sid{font-family:var(--mono);font-size:1.3rem;font-weight:600;letter-spacing:.03em;overflow-wrap:anywhere}
.idcard .row2{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.idcard .row2 b{overflow-wrap:anywhere}
.idcopy{all:unset;cursor:pointer;position:relative;z-index:1;margin-top:12px;font-size:.78rem;font-weight:700;display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.4)}
.idcopy svg{width:14px;height:14px}
.idcopy:focus-visible{outline:2px solid var(--id-ink)}
.idnote{font-size:.8rem;color:var(--side-muted);margin:10px 2px 0}
.stabs{max-width:1120px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-block:16px 2px}
.stabs button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.stabs button svg{width:18px;height:18px}
.stabs button:hover{background:var(--sunk);color:var(--ink)}
.stabs button[aria-selected="true"]{background:var(--scrub);color:var(--scrub-ink);box-shadow:0 8px 18px -8px var(--scrub)}
.stabs button:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}
.sp-main{max-width:1120px;margin:0 auto;padding-block:18px 60px}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin-bottom:18px}
.hc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;transition:transform .2s,box-shadow .2s;min-width:0}
.hc:hover{transform:translateY(-3px);box-shadow:0 14px 28px -18px rgba(0,0,0,.4)}
.hc .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hc .big{font-family:var(--display);font-size:1.2rem;font-weight:700;line-height:1.25}
.hc .s{font-size:.84rem;color:var(--muted)}
.ringbox{position:relative;width:92px;height:92px;flex:none}
.ring{width:92px;height:92px;display:block}
.ring circle{fill:none;stroke-width:10}
.ring .trk{stroke:var(--sunk)}

<script>
/* AlliedPath portal — Firebase adapter.
   Gives the portal the same small API it used inside claude.ai (db, user, room, downloads),
   backed by Firebase Auth (Google sign-in) and Cloud Firestore. */
(function(){
  const CFG = window.AP_FIREBASE_CONFIG;
  const OWNERS = (window.AP_OWNERS||[]).map(e=>e.toLowerCase());
  window.AP_STANDALONE = true;
  firebase.initializeApp(CFG);
  const auth = firebase.auth();
  const fs = firebase.firestore();
  try{ fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}

  let currentUser = null;
  const authReady = new Promise(res=>{ let done=false; auth.onAuthStateChanged(u=>{ currentUser=u; if(!done){done=true;res(u);} else { location.reload(); } }); });

  window.AP_signIn = async function(){
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{ await auth.signInWithPopup(p); }
    catch(e){ if(e && (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) await auth.signInWithRedirect(p); else throw e; }
  };
  window.AP_signOut = async function(){ try{ if(currentUser) await fs.doc("presence/"+currentUser.uid).set({q:null,req:null},{merge:true}); }catch(e){} await auth.signOut(); };

  const wrapDoc = d => ({ id:d.id, exists: d.exists, data: () => d.exists ? d.data() : undefined, metadata: d.metadata });
  const mapErr = e => ({ code: e && e.code==="permission-denied" ? "invalid_argument" : (e && e.code==="resource-exhausted" ? "resource_exhausted" : "unavailable"), message: (e && e.message) || "Error" });
  function docRef(path){
    const r = fs.doc(path);
    return {
      id: r.id, path,
      get: async()=> wrapDoc(await r.get()),
      set: async(data)=>{ try{ await r.set(data); }catch(e){ throw mapErr(e); } },
      update: async(data)=>{ try{ await r.update(data); }catch(e){ throw mapErr(e); } },
      delete: async()=>{ try{ await r.delete(); }catch(e){ throw mapErr(e); } },
      onSnapshot: (next, err)=> r.onSnapshot(d=>next(wrapDoc(d)), e=>err&&err(mapErr(e))),
      acquire: async()=>({acquired:true}),
      collection: (c)=> colRef(path+"/"+c)
    };
  }
  function colRef(path){
    const c = fs.collection(path);
    return {
      path,
      doc: (id)=> docRef(path+"/"+(id || c.doc().id)),
      onSnapshot: (next, err)=> c.onSnapshot(sn=>next({docs: sn.docs.map(wrapDoc), size: sn.size, empty: sn.empty}), e=>err&&err(mapErr(e))),
      get: async()=>{ const sn = await c.get(); return {docs: sn.docs.map(wrapDoc), size: sn.size, empty: sn.empty}; }
    };
  }
  const db = { doc: docRef, collection: colRef };

  function initialsAvatar(name){
    const ini = String(name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="32" fill="#12917f"/><text x="32" y="41" font-family="Arial" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">${ini}</text></svg>`;
    return "data:image/svg+xml;base64," + btoa(svg);
  }
  let staffInfo = null, profilesCache = null;
  async function loadStaff(){
    if(staffInfo) return staffInfo;
    const email = (currentUser.email||"").toLowerCase();
    const owner = OWNERS.includes(email) && currentUser.emailVerified;
    let staff = owner;
    if(!owner){ try{ const d = await fs.doc("staff/"+email).get(); staff = d.exists && currentUser.emailVerified; }catch(e){ staff=false; } }
    staffInfo = {owner, staff};
    try{ await fs.doc("profiles/"+currentUser.uid).set({name: currentUser.displayName||"", email, photo: currentUser.photoURL||"", lastSeen: Date.now()}, {merge:true}); }catch(e){}
    return staffInfo;
  }
  async function allProfiles(){
    if(profilesCache) return profilesCache;
    try{ const sn = await fs.collection("profiles").get(); profilesCache = {}; sn.docs.forEach(d=>profilesCache[d.id]=d.data()); }catch(e){ profilesCache = {}; }
    setTimeout(()=>profilesCache=null, 30000);
    return profilesCache;
  }
  const profileOf = (id,p)=>({ id, name: (p&&p.name)||"", avatarUrl: (p&&p.photo)||initialsAvatar(p&&p.name), color:"#12917f", email:(p&&p.email)||null, isMe: !!currentUser && id===currentUser.uid, guest:false });
  const user = {
    isOwner: async()=> (await loadStaff()).owner,
    canEdit: async()=> (await loadStaff()).staff,
    can: async()=> null,
    id: async()=> currentUser ? currentUser.uid : null,
    me: async()=>({ id: currentUser.uid, name: currentUser.displayName||"", email: currentUser.email, avatarUrl: currentUser.photoURL || initialsAvatar(currentUser.displayName), color:"#12917f", isOwner:(await loadStaff()).owner, canEdit:(await loadStaff()).staff }),
    profiles: async(ids)=>{ const all = await allProfiles(); const out={}; [].concat(ids).forEach(id=>out[id]=profileOf(id,all[id])); return out; },
    search: async(q)=>{ const all = await allProfiles(); q=String(q||"").toLowerCase(); return Object.entries(all).filter(([id,p])=>!q||(p.name||"").toLowerCase().includes(q)||(p.email||"").toLowerCase().includes(q)).slice(0,8).map(([id,p])=>profileOf(id,p)).filter(p=>p.name); }
  };

  // "room": presence stored in Firestore so requests survive until staff handle them
  const room = {
    presence: async(patch)=>{
      if(!currentUser) return;
      const data = {at: Date.now()};
      Object.entries(patch||{}).forEach(([k,v])=>{ data[k] = v===null ? firebase.firestore.FieldValue.delete() : v; });
      await fs.doc("presence/"+currentUser.uid).set(data, {merge:true});
    },
    onPeers: (handler, onErr)=>{
      return fs.collection("presence").onSnapshot(sn=>{
        const peers = sn.docs.map(d=>({peer:d.id, by:d.id, isMe: !!currentUser && d.id===currentUser.uid, sameTab:false, kind:"viewer", guest:false, presence:d.data()||{}, updatedAt: (d.data()||{}).at||0}))
          .filter(p=>Date.now()-(p.updatedAt||0) < 30*864e5);
        handler({peers, joined:[], left:[], updated:[]});
      }, e=>onErr&&onErr(mapErr(e)));
    }
  };
  const downloads = {
    save: async({filename, data})=>{
      const blob = data instanceof Blob ? data : new Blob([data], {type: /\.json$/.test(filename)?"application/json":/\.csv$/.test(filename)?"text/csv":/\.html?$/.test(filename)?"text/html":"application/octet-stream"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
  };
  window.claude = { use: async(name)=>{
    await authReady;
    if(!currentUser) return null;
    if(name==="db") return db;
    if(name==="user") return user;
    if(name==="room") return room;
    if(name==="downloads") return downloads;
    return null; // file uploads: use Google Drive links (Firebase Storage needs a paid plan)
  }};
})();

</script>

function errText(e){
  if(e&&e.code==="invalid_argument")return "You don't have permission to change this, or the entry is too large.";
  if(e&&e.code==="quota_exceeded")return "The portal's storage is full. Delete old entries and try again.";
  if(e&&e.code==="resource_exhausted")return "Too many changes at once. Wait a moment and try again.";
  return (e&&e.message)||"Something went wrong. Try again.";
}

/* attendance + fees maths */
function attOf(sid){let p=0,t=0;const recent=[];
  for(const [sessId,a] of Object.entries(S.attendance)){
    const pr=(a.present||[]).includes(sid),ab=(a.absent||[]).includes(sid);
    if(pr||ab){t++;if(pr)p++;const s=S.sessions[sessId];recent.push({date:s?.date||"",title:s?.title||"Session",mark:pr?"P":"A"})}
  }
  recent.sort((a,b)=>b.date.localeCompare(a.date));
  return {p,t,pct:t?Math.round(p/t*100):null,recent:recent.slice(0,12)};
}
function feeOf(sid){const plan=S.feeplans[sid]||null;const net=plan?(Number(plan.total)||0)-(Number(plan.discount)||0):0;
  const pays=vals("payments").filter(p=>p.studentId===sid).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const paid=pays.reduce((a,p)=>a+(Number(p.amount)||0),0);
  const due=net-paid;const overdue=plan&&due>0&&plan.dueDate&&plan.dueDate<today();
  return {plan,net,paid,due,pays,overdue};
}

/* ---------- data writes ---------- */
async function put(col,id,data){
  const ref=id?db.doc(col+"/"+id):db.collection(col).doc();
  S[col]={...S[col],[ref.id]:data};
  await ref.set(data);
  return ref.id;
}
async function del(col,id){const c={...S[col]};delete c[id];S[col]=c;await db.doc(col+"/"+id).delete()}

/* student portal sync — writes a private summary only the linked student (and staff) can read */
function summaryFor(sid){
  const st=S.students[sid];const a=attOf(sid);
  const mentoring=vals("mentoring").filter(m=>m.studentId===sid).sort((x,y)=>(y.date||"").localeCompare(x.date||"")).slice(0,15)
    .map(m=>({date:m.date||"",type:lab(MENTOR_TYPES,m.type),faculty:m.facultyId?facName(m.facultyId):"",notes:m.notes||"",nextStep:m.nextStep||"",status:m.status||"open"}));
  const pl=S.placements[sid];
  const issues=vals("issues").filter(i=>i.studentId===sid).sort((x,y)=>(y.createdAt||"").localeCompare(x.createdAt||"")).slice(0,10)
    .map(i=>({title:i.title||"",status:i.status||"open",createdAt:i.createdAt||"",resolution:i.resolution||""}));
  return {studentId:st.studentId||"",batchCode:st.batchId&&S.batches[st.batchId]?(S.batches[st.batchId].code||""):"",name:st.name||"",program:st.program||"",batchId:st.batchId||"",batchName:st.batchId?batchName(st.batchId):"",status:st.status||"",
    mentor:st.mentorId?facName(st.mentorId):"",attendance:{p:a.p,t:a.t,pct:a.pct,min:Number(CFG.attendanceMin)||75},recent:a.recent,
    tests:vals("attempts").filter(x=>x.studentId===sid).sort((x,y)=>(y.submittedAt||"").localeCompare(x.submittedAt||"")).slice(0,40).map(x=>({a:x.assessmentId,title:(S.assessments[x.assessmentId]||{}).title||"Test",score:x.score,total:x.total,pct:x.pct,at:x.submittedAt||""})),
    bookings:vals("bookings").filter(b=>b.studentId===sid).map(b=>{const sl=S.slots[b.slotId]||{};return {slot:b.slotId,date:sl.date||"",start:sl.start||"",end:sl.end||"",faculty:sl.facultyId?facName(sl.facultyId):"",facultyId:sl.facultyId||"",link:b.status==="booked"?((S.slotlinks[b.slotId]||{}).link||""):"",status:b.status,feedback:b.feedback||null}}).sort((x,y)=>(y.date+y.start).localeCompare(x.date+x.start)).slice(0,20),
    acks:((S.acks[sid]||{}).list||[]).slice(-20),
    ivNotes:((S.acks[sid]||{}).notes||[]).slice(-3),
    mentoring,placement:pl?{stage:lab(PLACE_STAGES,pl.stage),org:pl.org||"",role:pl.role||"",interviewDate:pl.interviewDate||""}:null,issues};
}
async function syncStudent(sid){
  const st=S.students[sid];if(!st||!st.linkedUid||!db)return;
  try{
    const sum=summaryFor(sid);const k=JSON.stringify(sum);
    if(synced["v"+sid]!==k){synced["v"+sid]=k;await db.doc("studentview/"+st.linkedUid).set({...sum,updatedAt:nowISO()})}
    if(isAdmin()){const fs=feeSummaryFor(sid);
      const fk=JSON.stringify(fs);
      if(synced["f"+sid]!==fk){synced["f"+sid]=fk;await db.doc("studentfees/"+st.linkedUid).set(fs)}
    }
  }catch(e){synced["v"+sid]=null;synced["f"+sid]=null;toast("Couldn't refresh the student's portal: "+errText(e))}
}
function feeSummaryFor(sid){const f=feeOf(sid);return {net:f.net,paid:f.paid,due:f.due,dueDate:f.plan?.dueDate||"",currency:CFG.currency,payments:f.pays.slice(0,20).map(p=>({date:p.date||"",amount:Number(p.amount)||0,receiptNo:p.receiptNo||"",mode:lab(PAY_MODES,p.mode)}))}}
function genBatchCode(program,start,selfId){
  const words=String(program||"Batch").replace(/&/g," ").split(/\s+/).filter(w=>w&&!/^(and|of|the|in)$/i.test(w));
  const ab=words.map(w=>w[0].toUpperCase()).join("").replace(/[^A-Z]/g,"").slice(0,5)||"GEN";
  const ym=(start||today()).slice(2,7).replace("-","");const base="AP-"+ab+"-"+ym;
  const used=new Set(vals("batches").filter(b=>b.id!==selfId).map(b=>b.code));let code=base,i=0;
  while(used.has(code)){i++;code=base+String.fromCharCode(64+i)}return code;
}
function assignStudentId(d,selfId){
  const b=d.batchId&&S.batches[d.batchId];if(!b||!b.code)return d;
  if(d.studentId&&d.studentId.startsWith(b.code+"-"))return d;
  let max=0;for(const [id,x] of Object.entries(S.students)){if(id!==selfId&&x.studentId&&x.studentId.startsWith(b.code+"-")){const n=parseInt(x.studentId.slice(b.code.length+1),10);if(n>max)max=n}}
  return {...d,studentId:b.code+"-"+String(max+1).padStart(3,"0")};
}
async function syncMany(ids){for(const id of new Set(ids))await syncStudent(id)}

let scheduled=false;
function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;render()})}

async function boot(){
  render();
  if(!window.claude||!window.claude.use){role="nodb";render();return}
  const slow=setTimeout(()=>{if(role==="loading"){window.__diag("Still waiting for the portal connection after 15 s")}},15000);
  try{[db,user,downloads,room,assetsCap]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads"),claude.use("room"),claude.use("assets")])}catch(e){window.__diag("Connection failed: "+((e&&(e.code||e.message))||e))}
  clearTimeout(slow);
  if(!db){role="nodb";render();return}
  const [own,edit]=user?await Promise.all([user.isOwner(),user.canEdit()]):[false,false];
  myId=user?await user.id():null; me=user?await user.me():null;
  role=own?"admin":edit?"faculty":"student";
  if(role==="student")startStudent();else startStaff();
  if(room&&role!=="student")room.onPeers(ch=>{peersList=ch.peers;schedule();relayTick()},()=>{});
  render();
}

    e=>{if(first){first=false;loaded++}schedule()});

function startStaff(){

const LOGO=`<svg class="aplogo" viewBox="0 0 64 64" width="38" height="38" role="img" aria-label="AlliedPath logo"><rect width="64" height="64" rx="15" fill="#0b1a30"/><path fill="#2ed3bf" d="M24 9h16a3 3 0 0 1 3 3v12h12a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H43v12a3 3 0 0 1-3 3H24a3 3 0 0 1-3-3V40H9a3 3 0 0 1-3-3V27a3 3 0 0 1 3-3h12V12a3 3 0 0 1 3-3z"/><path d="M15 50c10-3 15-12 20-22s9-14 13-16" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M42 8l10 2-5 8z" fill="#fff"/></svg>`;

function render(){
  const app=document.getElementById("app");
  const act=document.activeElement;const focusId=act&&act.id&&app.contains(act)?act.id:null;
  const selS=focusId&&act.selectionStart!=null?act.selectionStart:null;
  const pv=isStaff()&&ui.preview&&S.students[ui.preview];
  const key=[role,pv?"pv:"+ui.preview:view,ui.detail||"",(role==="student"||pv)?ui.sTab:"",loaded>=expected?"L":"l",role==="student"?(SV?"s1":"s0"):"",ui.test?"t"+ui.test.i:"",ui.testIntro||"",ui.testDone?"done":"",ui.assess||""].join("|");
  const animate=key!==lastKey;lastKey=key;
  try{
    if(role==="loading")app.innerHTML=splash("Opening AlliedPath…","Connecting to the portal.");
    else if(role==="nodb")app.innerHTML=signInScreen();
    else if(role==="student"||pv)app.innerHTML=studentPortal();
    else app.innerHTML=staffShell();
  }catch(e){window.__diag("Render failed: "+(e&&e.message))}
  if(app.classList)app.classList.toggle("enter",animate);
  if(animate)runCounters(app);
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();if(selS!=null&&el.setSelectionRange)try{el.setSelectionRange(selS,selS)}catch(e){}}}
}
function runCounters(root){
  try{if(!window.matchMedia||window.matchMedia("(prefers-reduced-motion: reduce)").matches||!root.querySelectorAll)return;
  root.querySelectorAll("[data-count]").forEach(el=>{const end=Number(el.dataset.count);if(!isFinite(end)||end===0)return;const t0=performance.now(),dur=1100;
    const step=now=>{const k=Math.min(1,(now-t0)/dur);el.textContent=Math.round(end*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};el.textContent="0";requestAnimationFrame(step)})}catch(e){}
}
function splash(t,d){return `<div class="splash"><div class="panel"><div class="brand" style="color:var(--ink);margin-bottom:14px">${LOGO}<div><b>Allied<em>Path</em></b><span style="color:var(--muted)">Teach · Mentor · Guide</span></div></div><h2>${esc(t)}</h2><p class="muted">${esc(d)}</p></div></div>`}

VIEWS.attendance=function(){
  const t=today();const ss=vals("sessions").filter(s=>s.status!=="cancelled"&&s.date<=t).sort((a,b)=>sessKey(b).localeCompare(sessKey(a)));
  const min=Number(CFG.attendanceMin)||75;
  if(!ss.length)return head("Attendance","Mark who attended each class.")+empty("No classes to mark yet","Attendance opens for a class on the day it is held. Schedule classes under Batches & timetable.",`<button class="btn" data-act="nav" data-arg="classes">Go to timetable</button>`);
  if(!ui.attSession||!S.sessions[ui.attSession])ui.attSession=(ss.find(s=>!S.attendance[s.id])||ss[0]).id;
  const sess=S.sessions[ui.attSession];
  const roster=vals("students").filter(s=>s.batchId===sess.batchId&&["admitted","active","completed"].includes(s.status)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!ui.attDraft||ui.attDraft.sessionId!==ui.attSession){const rec=S.attendance[ui.attSession];const marks={};
    roster.forEach(s=>{marks[s.id]=rec?((rec.present||[]).includes(s.id)?"p":(rec.absent||[]).includes(s.id)?"a":""):""});ui.attDraft={sessionId:ui.attSession,marks}}
  const m=ui.attDraft.marks;const pc=roster.filter(s=>m[s.id]==="p").length,ac=roster.filter(s=>m[s.id]==="a").length;
  const opts=ss.map(s=>`<option value="${s.id}" ${s.id===ui.attSession?"selected":""}>${esc(fmtShort(s.date))} · ${esc(batchName(s.batchId))} · ${esc(s.title)}${S.attendance[s.id]?" ✓":""}</option>`).join("");

/* ---------- assessments & interviews: shared ---------- */
const LET="ABCDEF";
const MEET_RE=/^https:\/\/meet\.google\.com\/[a-z]{3}-[a-z]{4}-[a-z]{3}(?:[?#].*)?$/i;
const ACTIVE_BK=st=>st==="requested"||st==="booked";
const audienceOk=(ids,bid)=>!ids||!ids.length||ids.includes("all")||(!!bid&&ids.includes(bid));
const CRIT=[["comm","Communication"],["tech","Technical knowledge"],["conf","Confidence"],["body","Body language"]];
const VERDICT=[["ready","Interview ready"],["nearly","Nearly ready"],["practice","Needs more practice"]];
const VERDICT_TONE={ready:"green",nearly:"amber",practice:"red"};
function avSmall(f){const ph=f&&typeof f.photo==="string"&&/^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+\/=]+$/.test(f.photo)?f.photo:null;return ph?`<img class="avs" src="${ph}" alt="">`:`<span class="avs">${esc(initials(f&&f.name))}</span>`}
function assessState(A,bid,t){if(A.status!=="published")return "draft";if(A.openFrom&&A.openFrom>t)return "upcoming";if(A.openTo&&A.openTo<t)return "closed";return "open"}
function parseQuestions(text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");const out=[];let cur=null,last=null;
  const finish=()=>{if(cur)out.push(cur);cur=null;last=null};
  lines.forEach((raw,ln)=>{const l=raw.trim();if(!l){return}
    let m;
    if((m=l.match(/^(?:q(?:uestion)?\s*)?\d+\s*[\.\):-]\s*(.+)$/i))||(m=l.match(/^q(?:uestion)?\s*[:.-]\s*(.+)$/i))){finish();cur={q:m[1],opts:[],ans:-1,exp:"",line:ln+1};last="q";return}
    if(!cur){cur={q:l,opts:[],ans:-1,exp:"",line:ln+1};last="q";return}
    if((m=l.match(/^\(?([a-f])\s*[\)\.:-]\s*(.+)$/i))&&cur.ans<0&&LET.indexOf(m[1].toUpperCase())===cur.opts.length){cur.opts.push(m[2]);last="o";return}
    if((m=l.match(/^(?:ans(?:wer)?|correct(?:\s*answer)?|key)\s*[:.\-]?\s*\(?([a-f])\)?\b/i))){cur.ans=LET.indexOf(m[1].toUpperCase());last="a";return}
    if((m=l.match(/^(?:exp(?:lanation)?|rationale|reason)\s*[:.\-]\s*(.*)$/i))){cur.exp=m[1];last="e";return}
    if(last==="q")cur.q+="\n"+l;else if(last==="o")cur.opts[cur.opts.length-1]+=" "+l;else if(last==="e"||last==="a")cur.exp+=(cur.exp?" ":"")+l;
  });finish();
  if(!out.length)throw new Error("No questions found. Use the format shown under the box.");
  out.forEach((q,i)=>{if(q.opts.length<2)throw new Error(`Question ${i+1} (line ${q.line}) needs at least two options, written A) … B) …`);if(q.ans<0||q.ans>=q.opts.length)throw new Error(`Question ${i+1} (line ${q.line}) needs an answer line, e.g. "Answer: B".`)});
  if(out.length>100)throw new Error("Keep a test to 100 questions or fewer.");
  return out;
}
function questionsToText(A,K){return (A.questions||[]).map((q,i)=>`${i+1}. ${q.q}\n${q.opts.map((o,j)=>`${LET[j]}) ${o}`).join("\n")}\nAnswer: ${LET[(K&&K.answers||[])[i]]||""}${(K&&K.explanations||[])[i]?`\nExplanation: ${K.explanations[i]}`:""}`).join("\n\n")}
function scoreAnswers(A,K,ans){let score=0;const items=(A.questions||[]).map((q,i)=>{const c=(K.answers||[])[i];const y=ans[i]??-1;if(y===c)score++;return {q:q.q,opts:q.opts,your:y,correct:c,exp:(K.explanations||[])[i]||""}});const total=items.length;return {score,total,pct:total?Math.round(score/total*100):0,items}}

/* student-side queue (sent to staff through the live room) */
function qKey(){return "ap_q_"+(myId||"x")}
function loadQueue(){try{const v=JSON.parse(localStorage.getItem(qKey())||"[]");queue=Array.isArray(v)?v:[]}catch(e){queue=[]}}
function pushQueue(){try{localStorage.setItem(qKey(),JSON.stringify(queue))}catch(e){}if(room)room.presence({q:queue.length?queue:null}).catch(()=>{})}
function enqueue(it){it.id="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);queue=queue.filter(x=>!(x.k===it.k&&((x.a&&x.a===it.a)||(x.s&&x.s===it.s)))).concat(it).slice(-8);pushQueue();schedule();return it.id}
function applyAcks(){if(!SV||!Array.isArray(SV.acks)||!queue.length)return;const map={};SV.acks.forEach(a=>{if(a&&a.id)map[a.id]=a});const done=queue.filter(i=>map[i.id]);if(!done.length)return;queue=queue.filter(i=>!map[i.id]);pushQueue();done.forEach(i=>{const a=map[i.id];if(a.msg)toast(a.msg)})}
const pendingOf=(k,key)=>queue.find(i=>i.k===k&&(i.a===key||i.s===key));

/* staff relay: confirms bookings and scores tests that students send */
async function relayTick(){
  if(!isStaff()||!db||loaded<expected||relayBusy)return;relayBusy=true;
  try{for(const p of peersList){
    if(p.isMe||p.kind!=="viewer"||!p.by)continue;const q=p.presence&&Array.isArray(p.presence.q)?p.presence.q:null;if(!q||!q.length)continue;
    const sid=Object.keys(S.students).find(k=>S.students[k].linkedUid===p.by);if(!sid)continue;
    const acked=new Set(((S.acks[sid]||{}).list||[]).map(a=>a.id));
    for(const it of q.slice(0,8)){
      if(!it||typeof it.id!=="string"||it.id.length>24||acked.has(it.id)||relayDone.has(it.id))continue;relayDone.add(it.id);
      let res;try{res=await relayItem(it,sid,p.by)}catch(e){res={ok:false,msg:"Something went wrong. Please try again."}}
      const list=((S.acks[sid]||{}).list||[]).concat({id:it.id,k:String(it.k||""),ok:!!res.ok,msg:res.msg||"",at:nowISO()}).slice(-25);
      try{await put("acks",sid,{list})}catch(e){}
      await syncStudent(sid);
    }}}finally{relayBusy=false}
}
async function relayItem(it,sid,uid){
  const st=S.students[sid],t=today();
  if(it.k==="sub"){
    const A=S.assessments[it.a],K=S.assesskeys[it.a];if(!A||!K)return {ok:false,msg:"That test is no longer available."};
    const aid=it.a+"_"+sid;if(S.attempts[aid])return {ok:true,msg:""};
    if(!audienceOk(A.batchIds,st.batchId))return {ok:false,msg:"That test isn't set for your batch."};
    if(A.status!=="published")return {ok:false,msg:A.title+" is closed."};
    if(A.openTo&&A.openTo<addDays(t,-1))return {ok:false,msg:A.title+" closed before your answers arrived. Contact your faculty."};
    const n=(A.questions||[]).length;const ans=String(it.ans||"").slice(0,n).padEnd(n,"-").split("").map(c=>c==="-"?-1:(LET.indexOf(c)));
    const r=scoreAnswers(A,K,ans);const dur=Number(it.t1)>Number(it.t0)?Math.round((Number(it.t1)-Number(it.t0))/1000):null;
    await put("attempts",aid,{assessmentId:it.a,studentId:sid,uid,answers:ans,score:r.score,total:r.total,pct:r.pct,durationSec:dur,submittedAt:nowISO()});
    if(A.showAnswers!==false)try{await db.doc("studentview/"+uid+"/reviews/"+it.a).set({title:A.title,score:r.score,total:r.total,items:r.items})}catch(e){}
    return {ok:true,msg:`${A.title}: you scored ${r.score}/${r.total} (${r.pct}%)`};
  }
  if(it.k==="book"){
    const sl=S.slots[it.s];if(!sl||sl.status!=="open")return {ok:false,msg:"That interview slot was just taken. Please pick another."};
    if(sl.date<t)return {ok:false,msg:"That slot has already passed."};
    if(!audienceOk(sl.batchIds,st.batchId))return {ok:false,msg:"That slot isn't open for your batch."};
    if(vals("bookings").some(b=>b.studentId===sid&&ACTIVE_BK(b.status)&&((S.slots[b.slotId]||{}).date||"")>=t))return {ok:false,msg:"You already have a mock interview booked or waiting for approval. Cancel it first to request another."};
    const ref=db.doc("slots/"+it.s);
    if(ref.acquire){const l=await ref.acquire({holder:myId||"staff",ttlMs:8000});if(!l.acquired)return {ok:false,msg:"Someone else is booking that slot. Please pick another."};const fr=await ref.get();if(!fr.exists||(fr.data()||{}).status!=="open")return {ok:false,msg:"That interview slot was just taken. Please pick another."}}
    await put("slots",it.s,{...sl,status:"requested"});
    await put("bookings",it.s,{slotId:it.s,studentId:sid,uid,status:"requested",requestedAt:nowISO(),via:"portal"});
    return {ok:true,msg:`Request sent to ${facName(sl.facultyId)} for ${relDay(sl.date)} at ${sl.start}. You'll get the Google Meet link once it's approved.`};
  }
  if(it.k==="cancel"){
    const b=S.bookings[it.s];if(!b||b.studentId!==sid||!ACTIVE_BK(b.status))return {ok:true,msg:""};
    const sl=S.slots[it.s];if(sl&&sl.date<t)return {ok:false,msg:"Past interviews can't be cancelled."};
    await del("bookings",it.s);if(S.slotlinks[it.s])await del("slotlinks",it.s);if(sl)await put("slots",it.s,{...sl,status:"open"});return {ok:true,msg:b.status==="requested"?"Your interview request is withdrawn.":"Your mock interview booking is cancelled."};
  }
  return {ok:false,msg:""};
}

function openContent(id){

function readImage(file){return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type||""))return rej(new Error("Choose a JPG or PNG photo."));
  const r=new FileReader();r.onerror=()=>rej(new Error("Couldn't read that photo."));
  r.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error("That photo couldn't be opened. Try a JPG or PNG."));
    img.onload=()=>{const SZ=320,c=document.createElement("canvas");c.width=SZ;c.height=SZ;const ctx=c.getContext("2d");const m=Math.min(img.width,img.height);
      const sx=(img.width-m)/2,sy=img.height>img.width?(img.height-m)*0.2:(img.height-m)/2;ctx.drawImage(img,sx,sy,m,m,0,0,SZ,SZ);res(c.toDataURL("image/jpeg",0.84))};
    img.src=r.result};r.readAsDataURL(file)})}

/* ---------- forms ---------- */
let formCtx=null;
function fieldHTML(f){
  const id="f_"+f.key,v=f.value??"";
  if(f.type==="checkbox")return `<label class="check ${f.full?"full":""}"><input type="checkbox" id="${id}" name="${f.key}" ${v?"checked":""}> ${esc(f.label)}</label>`;
  let ctl;
  if(f.type==="select")ctl=`<select id="${id}" name="${f.key}">${f.options.map(([ov,ol])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?"selected":""}>${esc(ol)}</option>`).join("")}</select>`;
  else if(f.type==="multi")ctl=`<div style="display:flex;flex-wrap:wrap;gap:6px 14px">${f.options.map(([ov,ol])=>`<label class="check"><input type="checkbox" name="${f.key}" value="${esc(ov)}" ${(v||[]).includes(ov)?"checked":""}> ${esc(ol)}</label>`).join("")||'<span class="muted small">Add faculty first.</span>'}</div>`;
  else if(f.type==="file")ctl=`<input id="${id}" name="${f.key}" type="file" ${f.accept?`accept="${esc(f.accept)}"`:""}>`;
  else if(f.type==="textarea")ctl=`<textarea id="${id}" name="${f.key}" rows="${f.rows||3}">${esc(v)}</textarea>`;
  else ctl=`<input id="${id}" name="${f.key}" type="${f.type||"text"}" value="${esc(v)}" ${f.type==="number"?'step="any" min="0"':""} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""}>`;
  return `<label class="field ${f.full?"full":""}"><span>${esc(f.label)}${f.required?" *":""}</span>${ctl}${f.hint?`<small>${esc(f.hint)}</small>`:""}</label>`;
}
function openForm(o){
  formCtx=o;const m=document.getElementById("modal");
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">${esc(o.title)}</h2>${o.intro||""}<form id="mForm" class="form" novalidate>${o.fields.map(fieldHTML).join("")}</form>${o.extra||""}<div id="mErr" class="formerr" hidden></div>
  <div class="sheetfoot">${o.danger?`<button class="btn danger" data-act="formDanger">${esc(o.danger.label)}</button>`:""}<span class="right"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="formSubmit">${esc(o.submit||"Save")}</button></span></div></div>`;
  m.hidden=false;const first=m.querySelector("input,select,textarea");if(first)first.focus();
}
function closeModal(){const m=document.getElementById("modal");m.hidden=true;m.innerHTML="";formCtx=null}
function formErr(msg){const e=document.getElementById("mErr");if(e){e.textContent=msg;e.hidden=false}}
function collect(){
  const f=document.getElementById("mForm");const out={};
  for(const fd of formCtx.fields){
    if(fd.type==="multi"){out[fd.key]=[...f.querySelectorAll(`input[name="${fd.key}"]:checked`)].map(i=>i.value);continue}
    const el=f.elements[fd.key];if(!el)continue;
    if(fd.type==="file"){out[fd.key]=el.files&&el.files[0]||null;continue}
    if(fd.type==="checkbox")out[fd.key]=el.checked;
    else if(fd.type==="number")out[fd.key]=el.value===""?null:Number(el.value);
    else out[fd.key]=el.value.trim();
  }
  for(const fd of formCtx.fields)if(fd.required&&(out[fd.key]===""||out[fd.key]==null))throw new Error(fd.label+" is required.");
  return out;
}
async function submitForm(btn){
  if(!formCtx)return;let v;try{v=collect()}catch(e){formErr(e.message);return}
  btn.disabled=true;const lbl=btn.textContent;btn.textContent="Saving…";
  try{await formCtx.onSubmit(v);closeModal();schedule()}catch(e){formErr(errText(e));btn.disabled=false;btn.textContent=lbl}
}

  exportStudents:()=>{const rows=[["Student ID","Name","Phone","Email","City","Country","Program","Batch","Status","Source","Enquiry date","Admitted","Attendance %","Mentor"]].concat(vals("students").map(s=>{const a=attOf(s.id);return [s.studentId||"",s.name,s.phone,s.email,s.city,s.country,s.program,s.batchId?batchName(s.batchId):"",lab(STATUSES,s.status),lab(SOURCES,s.source),s.enquiryDate,s.admitDate,a.pct??"",s.mentorId?facName(s.mentorId):""]}));save("alliedpath-students-"+today()+".csv",csv(rows))},
  exportPayments:()=>{const rows=[["Receipt","Date","Student","Program","Mode","Reference","Amount"]].concat(vals("payments").sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(p=>[p.receiptNo,p.date,studentName(p.studentId),S.students[p.studentId]?.program||"",lab(PAY_MODES,p.mode),p.ref,p.amount]));save("alliedpath-payments-"+today()+".csv",csv(rows))},
  exportAll:()=>{const o={exportedAt:nowISO(),settings:CFG};COLS.forEach(c=>o[c]=S[c]);save("alliedpath-backup-"+today()+".json",JSON.stringify(o,null,2))},
  copyWa:async()=>{const n=CFG.whatsapp||CFG_DEFAULT.whatsapp;try{await navigator.clipboard.writeText(n);toast("Number copied")}catch(e){toast("Select the number to copy it")}}
};

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const m=document.getElementById("modal");
  if(e.target===m){closeModal();return}
  const el=e.target.closest("[data-act]");if(!el)return;
  const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset.arg,el,e)}
});
document.addEventListener("keydown",e=>{
  if(ui.test&&document.getElementById("modal").hidden&&!/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||"")){const T=ui.test,A=S.assessments[T.a];
    if(A){const k=e.key.toUpperCase();const j=LET.indexOf(k);const num=Number(e.key)-1;const pick=j>=0&&j<A.questions[T.i].opts.length?j:(num>=0&&num<A.questions[T.i].opts.length?num:-1);
      if(pick>=0){T.ans[T.i]=pick;T.confirm=false;render();return}if(e.key==="ArrowRight"&&T.i<T.ans.length-1){T.i++;render();return}if(e.key==="ArrowLeft"&&T.i>0){T.i--;render();return}}}
  if(e.key==="Escape"&&!document.getElementById("modal").hidden)closeModal();
  if(e.key==="Enter"&&e.target.matches("tr.row,.card.click,div.fcard,div.lcard")){e.target.click()}
  if(e.key==="Enter"&&e.target.closest("#mForm")&&e.target.tagName==="INPUT"){e.preventDefault();const b=document.querySelector('[data-act="formSubmit"]');if(b)submitForm(b)}
});
let linkT;
document.addEventListener("input",e=>{
  const k=e.target.dataset.input;if(!k)return;
  if(k==="linkSearch"){runLinkSearch(e.target.dataset.arg,e.target.value);return}
  ui[k]=e.target.value;render();
});
document.addEventListener("change",e=>{
  const k=e.target.dataset.chg;if(!k)return;
  if(k==="pvPick"){clearInterval(tInt);ui.test=null;ui.testIntro=null;ui.testDone=null;ui.preview=e.target.value;render();return}
  if(k==="attSession"){ui.attSession=e.target.value;ui.attDraft=null;render()}
  if(k==="quickStatus"){const id=e.target.dataset.arg;const st=S.students[id];const v=e.target.value;const d={...st,status:v,updatedAt:nowISO()};if(["admitted","active"].includes(v)&&!d.admitDate)d.admitDate=today();
    put("students",id,d).then(()=>syncStudent(id)).then(()=>toast("Status: "+lab(STATUSES,v))).catch(err=>toast(errText(err)));render()}
});
document.addEventListener("submit",async e=>{
  if(e.target.dataset.submit!=="saveCfg")return;e.preventDefault();
  const progs=document.getElementById("cfg_programs").value.split("\n").map(x=>x.trim()).filter(Boolean);
  const d={programs:progs.length?progs:CFG_DEFAULT.programs,attendanceMin:Math.min(100,Math.max(0,Number(document.getElementById("cfg_att").value)||75)),currency:document.getElementById("cfg_cur").value.trim()||"₹",receiptPrefix:document.getElementById("cfg_pre").value.trim()||"AP",whatsapp:document.getElementById("cfg_wa").value.trim()};
  try{CFG={...CFG,...d};await db.doc("settings/main").set(d);toast("Settings saved")}catch(err){toast(errText(err))}
});
boot();
</script>

<script>
/* AlliedPath portal — standalone additions (sign-in, sign-out, staff access, import) */
function signInScreen(){
  return `<div class="splash"><div class="panel" style="max-width:440px;text-align:center"><div class="brand" style="color:var(--ink);justify-content:center;margin-bottom:18px">${LOGO}<div style="text-align:left"><b>Allied<em>Path</em></b><span style="color:var(--muted)">Teach · Mentor · Guide</span></div></div>
  <h2>Welcome to the AlliedPath portal</h2><p class="muted">Students, faculty and staff sign in with their Google account.</p>
  <button class="btn primary" data-act="signIn" style="font-size:1rem;padding:11px 20px;margin-top:6px"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="currentColor" opacity=".8" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="currentColor" opacity=".6" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z"/><path fill="currentColor" opacity=".9" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"/></svg> Sign in with Google</button>
  <p class="small muted" style="margin-top:16px">New student? Sign in, then tap <b>Request access</b>. The AlliedPath office links your account to your student record.</p>
  <p class="small muted">Help: WhatsApp <b class="mono" style="user-select:all">9596830800</b></p></div></div>`;
}
S.staff={};
ACT.signIn=async()=>{try{await AP_signIn()}catch(e){toast(e&&e.code==="auth/popup-closed-by-user"?"Sign-in was cancelled.":"Sign-in failed: "+((e&&e.message)||"try again"))}};
ACT.signOut=()=>{AP_signOut()};
const _startStaff=startStaff;
startStaff=function(){_startStaff();if(isAdmin()){expected++;watchCol("staff")}};
function staffPanel(){
  if(!isAdmin())return "";
  const list=Object.entries(S.staff).sort((a,b)=>a[0].localeCompare(b[0]));
  return `<section class="panel" style="margin-top:16px"><h2>Staff access</h2><p class="small muted">Faculty sign in with Google using the email you add here. They manage students, classes, content, tests and interviews, but never see fees. Owners: ${esc((window.AP_OWNERS||[]).join(", "))}.</p>
  ${list.length?`<div class="list">${list.map(([em,d])=>`<div class="li"><div><div class="t">${esc(d.name||em)}</div><div class="d mono">${esc(em)}</div></div><button class="btn ghost" data-act="staffDel" data-arg="${esc(em)}">Remove</button></div>`).join("")}</div>`:`<p class="muted">No faculty added yet.</p>`}
  <div class="actions" style="margin-top:12px"><button class="btn primary" data-act="staffAdd">Add faculty login</button><button class="btn" data-act="importBackup">Import backup</button></div></section>`;
}
const _settings=VIEWS.settings;VIEWS.settings=function(){return _settings()+staffPanel()};
ACT.staffAdd=()=>openForm({title:"Add a faculty login",fields:[{key:"email",label:"Their Google email",type:"email",required:true,full:true,placeholder:"name@gmail.com"},{key:"name",label:"Name",full:true}],submit:"Give access",
  onSubmit:async v=>{const em=v.email.trim().toLowerCase();if(!/^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/.test(em))throw new Error("Enter a valid email address.");await put("staff",em,{name:v.name||"",role:"faculty",addedAt:nowISO()});toast("Access given to "+em+". They can sign in now.")}});
ACT.staffDel=a=>openForm({title:"Remove this login?",intro:`<p>${esc(a)} will lose faculty access the next time they open the portal.</p>`,fields:[],submit:"Remove access",onSubmit:async()=>{await del("staff",a);toast("Access removed")}});
async function AP_import(obj){
  if(!isAdmin())throw new Error("Only an owner can import.");let n=0;
  for(const c of COLS){for(const [id,d] of Object.entries((obj&&obj[c])||{})){if(d&&typeof d==="object"){const clean={...d};delete clean.id;await db.doc(c+"/"+id).set(clean);n++}}}
  if(obj&&obj.settings&&typeof obj.settings==="object"){await db.doc("settings/main").set(obj.settings);n++}
  return n;
}
window.AP_import=AP_import;
ACT.importBackup=()=>openForm({title:"Import a backup",intro:`<p class="small muted" style="margin:-6px 0 12px">Choose a backup file downloaded from Settings → Download full backup. Records with the same ID are replaced.</p>`,fields:[{key:"file",label:"Backup file (.json)",type:"file",accept:"application/json,.json",required:true,full:true}],submit:"Import",
  onSubmit:async v=>{const txt=await v.file.text();let obj;try{obj=JSON.parse(txt)}catch(e){throw new Error("That file isn't a valid backup.")}const n=await AP_import(obj);toast(`Imported ${n} records`)}});

</script>
